<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>จองห้อง — NIRA Residence</title>
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/theme.css">
<style>
.page{padding:calc(var(--nav-h) + 40px) 0 90px;}
.checkout{display:grid;grid-template-columns:1fr 380px;gap:32px;align-items:start;}
@media(max-width:1020px){.checkout{grid-template-columns:1fr;}}
.steps{display:flex;gap:0;margin-bottom:38px;overflow-x:auto;}
.step{flex:1;min-width:118px;position:relative;padding-top:34px;text-align:center;font-size:13px;color:var(--muted-2);}
.step::before{content:"";position:absolute;top:11px;left:0;right:0;height:2px;background:var(--line);}
.step:first-child::before{left:50%;} .step:last-child::before{right:50%;}
.step .b{position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;z-index:2;}
.step.done::before,.step.on::before{background:var(--accent);}
.step.done .b{background:var(--accent);border-color:var(--accent);color:#0A0A0A;}
.step.on .b{background:var(--accent);border-color:var(--accent);color:#0A0A0A;box-shadow:0 0 0 5px rgba(214,255,102,.15);}
.step.on,.step.done{color:var(--text);}
.pane{display:none;} .pane.on{display:block;}
.summary{position:sticky;top:calc(var(--nav-h) + 20px);}
.payopt{display:grid;gap:12px;}
.payopt label{display:flex;gap:13px;align-items:flex-start;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r-md);cursor:pointer;background:var(--surface-2);transition:.2s;}
.payopt label:hover{border-color:var(--line-strong);}
.payopt input{margin-top:3px;accent-color:var(--accent);}
.payopt input:checked ~ .pinfo{color:#fff;}
.payopt label:has(input:checked){border-color:rgba(214,255,102,.5);background:rgba(214,255,102,.05);}
.qr{width:200px;height:200px;background:#fff;border-radius:14px;padding:12px;margin:0 auto;}
.dropzone{border:1.5px dashed var(--line-strong);border-radius:var(--r-md);padding:30px;text-align:center;cursor:pointer;transition:.2s;}
.dropzone:hover{border-color:var(--accent);background:var(--accent-ghost);}
.planopt{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:760px){.planopt{grid-template-columns:1fr;}}
.planopt label{border:1px solid var(--line);border-radius:var(--r-md);padding:20px;cursor:pointer;display:block;background:var(--surface-2);transition:.2s;}
.planopt label:has(input:checked){border-color:rgba(214,255,102,.5);background:rgba(214,255,102,.06);}
.planopt input{accent-color:var(--accent);}
.receipt{border:1px solid var(--line);border-radius:var(--r-lg);padding:32px;background:var(--surface);}
.receipt-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding-bottom:22px;margin-bottom:22px;}
@media print{.nav,.footer,.steps,.no-print{display:none!important}body{background:#fff;color:#000}.receipt{border-color:#ccc}}
</style>
</head>
<body>
<script src="assets/data.js"></script>
<script src="assets/ui.js"></script>
<script>boot('ค้นหาห้อง')</script>

<main class="page"><div class="wrap" id="root"></div></main>

<script>
const u = Store.unit(qs.get('unit'));
if(!u || ['Sold','Blocked','Reserved','Contracted'].includes(u.status)){
  document.getElementById('root').innerHTML =
    `<div style="text-align:center;padding:80px 0"><h2>ห้องนี้ไม่พร้อมให้จอง</h2><p style="margin:14px 0 24px">อาจถูกจองไปแล้วหรือไม่มีในระบบ</p><a class="btn btn-primary" href="units.html">เลือกห้องอื่น</a></div>`;
  renderFooter();
} else {
  const p = Store.project(u.projectId);
  let PLAN_KEY = 'B';
  const PLANS = {
    A:{name:'ผ่อนสบาย',down:.15,inst:12,bookingFee:p.paymentTerm.bookingFee,contractPct:.05,cashDisc:0,perk:'ฟรีค่าส่วนกลาง 1 ปี'},
    B:{name:'ยอดนิยม',down:.10,inst:6,bookingFee:Math.round(p.paymentTerm.bookingFee*.6/1000)*1000,contractPct:.05,cashDisc:0,perk:'ฟรีค่าส่วนกลาง 2 ปี + เฟอร์นิเจอร์'},
    C:{name:'เงินสด',down:0,inst:0,bookingFee:p.paymentTerm.bookingFee,contractPct:0,cashDisc:.07,perk:'ส่วนลดเงินสด 7% + ฟรีค่าโอน'}
  };
  let STEP = 1;
  let CUSTOMER = null, BOOKING = null;

  function planCalc(){
    const P = PLANS[PLAN_KEY];
    const net = Math.round(u.priceNet * (1 - P.cashDisc));
    const booking = P.bookingFee;
    const contract = Math.round(net * P.contractPct);
    const downTotal = Math.round(net * P.down);
    const per = P.inst ? Math.round(downTotal/P.inst/100)*100 : 0;
    const installments = [];
    const start = new Date(); start.setMonth(start.getMonth()+1); start.setDate(5);
    for(let i=1;i<=P.inst;i++){
      const d=new Date(start); d.setMonth(d.getMonth()+i-1);
      installments.push({no:i,dueDate:d.toISOString().slice(0,10),
        amount: i===P.inst ? downTotal-per*(P.inst-1) : per, status:'Pending', paidAt:null});
    }
    const transferAmount = net - booking - contract - downTotal;
    const loan = P.cashDisc ? 0 : Math.round(transferAmount);
    const costs = buildTransferCosts({...u, priceNet:net}, p, loan);
    const bank = p.banks[0];
    const monthly = loan>0 ? monthlyPayment(loan, bank.rate, 30) : 0;
    return {P,net,booking,contract,downTotal,installments,transferAmount,loan,costs,bank,monthly,
            discount:u.discount + (u.priceNet-net)};
  }

  /* ---------------- shell ---------------- */
  function shell(){
    const c = planCalc();
    document.getElementById('root').innerHTML = `
    <div class="steps no-print">
      ${['เลือกแผนชำระ','ข้อมูลผู้ซื้อ','ตรวจสอบยอดรวม','ชำระเงินจอง','เสร็จสิ้น']
        .map((s,i)=>`<div class="step ${STEP===i+1?'on':STEP>i+1?'done':''}"><span class="b">${STEP>i+1?'✓':i+1}</span>${s}</div>`).join('')}
    </div>
    <div class="checkout">
      <div id="panes"></div>
      <aside class="summary no-print" id="summary"></aside>
    </div>`;
    renderSummary(c); renderPane(c);
  }

  /* ---------------- summary sidebar ---------------- */
  function renderSummary(c){
    document.getElementById('summary').innerHTML = `
      <div class="card">
        <div class="row" style="gap:14px;align-items:flex-start">
          <div class="ph no-scrim" style="width:82px;height:66px;border-radius:10px;flex:0 0 82px;overflow:hidden">
            ${imgTag(imgKey.unit(u), `ห้อง ${u.unitNo}`)}
            <span class="ph-label" style="font-size:9px">${u.layoutCode}</span>
          </div>
          <div style="min-width:0">
            <div class="tiny muted">${p.nameTh}</div>
            <div style="font-weight:700;margin-top:3px">ห้อง ${u.unitNo}</div>
            <div class="tiny muted">${u.roomType} · ${u.usableAreaSqm} ตร.ม. · ชั้น ${u.floor}</div>
          </div>
        </div>
        <hr class="divider" style="margin:18px 0">
        <div class="kv"><span class="k">ราคาป้าย</span><span class="v">${fmt.baht(u.priceList)}</span></div>
        <div class="kv"><span class="k">ส่วนลดรวม</span><span class="v accent">${c.discount?'− '+fmt.baht(c.discount):'—'}</span></div>
        <div class="kv"><span class="k">ราคาสุทธิ</span><span class="v">${fmt.baht(c.net)}</span></div>
        <hr class="divider" style="margin:14px 0">
        <div class="kv"><span class="k">เงินทำสัญญา (7 วัน)</span><span class="v">${fmt.baht(c.contract)}</span></div>
        <div class="kv"><span class="k">ดาวน์ ${(c.P.down*100).toFixed(0)}%${c.P.inst?` · ${c.P.inst} งวด`:''}</span><span class="v">${fmt.baht(c.downTotal)}</span></div>
        <div class="kv"><span class="k">ยอดวันโอน</span><span class="v">${fmt.baht(c.transferAmount)}</span></div>
        <div class="kv total"><span class="k">ชำระวันนี้ (เงินจอง)</span><span class="v">${fmt.baht(c.booking)}</span></div>
        <div class="badge badge-accent" style="width:100%;justify-content:center;margin-top:16px">🎁 ${c.P.perk}</div>
        <p class="tiny center" style="margin-top:14px;color:var(--muted-2)">ห้องถูกล็อกให้ 7 วันหลังชำระ</p>
      </div>`;
  }

  /* ---------------- panes ---------------- */
  function renderPane(c){
    const box = document.getElementById('panes');
    if(STEP===1) box.innerHTML = pane1(c);
    if(STEP===2) box.innerHTML = pane2(c);
    if(STEP===3) box.innerHTML = pane3(c);
    if(STEP===4) box.innerHTML = pane4(c);
    if(STEP===5) box.innerHTML = pane5(c);
    initReveal();
  }

  /* ---- 1. plan ---- */
  const pane1 = c => `
    <h1 style="font-size:30px">เลือกแผนการชำระเงิน</h1>
    <p class="lead" style="margin-top:12px">ราคาห้องเท่ากันทุกแผน ต่างกันที่จังหวะการจ่ายและสิทธิพิเศษที่ได้รับ</p>
    <div class="planopt" style="margin-top:28px">
      ${Object.entries(PLANS).map(([k,P])=>{
        const net=Math.round(u.priceNet*(1-P.cashDisc));
        return `<label>
          <div class="row-between"><span style="font-weight:700">แผน ${k} · ${P.name}</span><input type="radio" name="plan" value="${k}" ${k===PLAN_KEY?'checked':''} onchange="setPlan('${k}')"></div>
          <div style="font-size:30px;font-weight:700;letter-spacing:-.03em;margin:12px 0 4px">${P.cashDisc?('−'+(P.cashDisc*100).toFixed(0)+'%'):((P.down*100).toFixed(0)+'%')}</div>
          <div class="tiny muted">${P.cashDisc?'ส่วนลดเงินสด':'เงินดาวน์'}</div>
          <hr class="divider" style="margin:16px 0">
          <div class="kv" style="padding:7px 0"><span class="k tiny">เงินจอง</span><span class="v tiny">${fmt.baht(P.bookingFee)}</span></div>
          <div class="kv" style="padding:7px 0"><span class="k tiny">ทำสัญญา</span><span class="v tiny">${P.contractPct?fmt.baht(Math.round(net*P.contractPct)):'—'}</span></div>
          <div class="kv" style="padding:7px 0"><span class="k tiny">ผ่อนดาวน์</span><span class="v tiny">${P.inst?P.inst+' งวด':'ไม่มี'}</span></div>
          <div class="kv" style="padding:7px 0"><span class="k tiny">ราคาสุทธิ</span><span class="v tiny accent">${fmt.baht(net)}</span></div>
          <div class="badge" style="margin-top:12px;width:100%;justify-content:center">🎁 ${P.perk}</div>
        </label>`;}).join('')}
    </div>

    <div class="card" style="margin-top:26px">
      <h4>ตารางผ่อนดาวน์ตามแผนที่เลือก</h4>
      ${c.installments.length ? `<div class="tablewrap" style="margin-top:16px;border:0"><table>
        <thead><tr><th>งวด</th><th>ครบกำหนด</th><th class="num">จำนวนเงิน</th></tr></thead>
        <tbody>${c.installments.map(i=>`<tr><td>${i.no}</td><td>${fmt.date(i.dueDate)}</td><td class="num">${fmt.baht(i.amount)}</td></tr>`).join('')}</tbody></table></div>`
      : `<p style="margin-top:12px">แผนเงินสดไม่มีการผ่อนดาวน์ — ชำระส่วนที่เหลือ ${fmt.baht(c.transferAmount)} ภายใน 30 วันหลังทำสัญญา</p>`}
    </div>

    <div class="row" style="gap:12px;margin-top:26px">
      <a class="btn btn-ghost" href="unit.html?id=${encodeURIComponent(u.id)}">← กลับไปดูห้อง</a>
      <button class="btn btn-primary" onclick="go(2)">ถัดไป: กรอกข้อมูลผู้ซื้อ</button>
    </div>`;

  /* ---- 2. customer ---- */
  const pane2 = c => `
    <h1 style="font-size:30px">ข้อมูลผู้ซื้อ</h1>
    <p class="lead" style="margin-top:12px">ข้อมูลนี้จะใช้ออกใบจองและสัญญาจะซื้อจะขาย กรุณากรอกตามบัตรประชาชน/หนังสือเดินทาง</p>
    <form id="cusForm" style="display:grid;gap:20px;margin-top:28px" onsubmit="submitCustomer(event)">
      <div class="card">
        <h4>ข้อมูลส่วนตัว</h4>
        <div class="grid g2" style="gap:16px;margin-top:18px">
          <div class="field"><label>คำนำหน้า</label><select class="select" name="prefix"><option>นาย</option><option>นาง</option><option>นางสาว</option><option>Mr.</option><option>Mrs.</option><option>Ms.</option></select></div>
          <div class="field"><label>สัญชาติ <span class="req">*</span></label><select class="select" name="nationality" required onchange="toggleForeign(this.value)"><option>ไทย</option><option>ญี่ปุ่น</option><option>จีน</option><option>สิงคโปร์</option><option>อื่น ๆ</option></select></div>
          <div class="field"><label>ชื่อ <span class="req">*</span></label><input class="input" name="firstName" required></div>
          <div class="field"><label>นามสกุล <span class="req">*</span></label><input class="input" name="lastName" required></div>
          <div class="field"><label>เลขบัตรประชาชน / Passport <span class="req">*</span></label><input class="input" name="idCard" required placeholder="x-xxxx-xxxxx-xx-x"></div>
          <div class="field"><label>วันเกิด <span class="req">*</span></label><input class="input" type="date" name="dob" required></div>
        </div>
        <div id="foreignNote" style="display:none;margin-top:16px">
          <div class="badge badge-info" style="width:100%;justify-content:flex-start;padding:13px;line-height:1.5;white-space:normal;text-align:left">
            ผู้ซื้อชาวต่างชาติ: โควตาต่างชาติของโครงการนี้เหลือ ${(p.foreignQuotaPct-p.foreignQuotaSoldPct).toFixed(0)}% — ต้องแสดงหลักฐานการโอนเงินจากต่างประเทศ (FET/Credit Advice) ก่อนวันโอนกรรมสิทธิ์
          </div>
        </div>
      </div>

      <div class="card">
        <h4>ช่องทางติดต่อ</h4>
        <div class="grid g2" style="gap:16px;margin-top:18px">
          <div class="field"><label>เบอร์โทรศัพท์ <span class="req">*</span></label><input class="input" name="phone" required placeholder="08x-xxx-xxxx"></div>
          <div class="field"><label>อีเมล <span class="req">*</span></label><input class="input" type="email" name="email" required></div>
          <div class="field"><label>LINE ID</label><input class="input" name="lineId"></div>
          <div class="field"><label>อาชีพ</label><input class="input" name="occupation" placeholder="เช่น พนักงานบริษัท"></div>
        </div>
        <div class="field" style="margin-top:16px"><label>ที่อยู่ตามทะเบียนบ้าน <span class="req">*</span></label><textarea class="textarea" name="address" required></textarea></div>
      </div>

      <div class="card">
        <h4>ข้อมูลเพื่อประเมินสินเชื่อ <span class="tiny muted">(ไม่บังคับ แต่ช่วยให้ทีมสินเชื่อเตรียมงานได้เร็วขึ้น)</span></h4>
        <div class="grid g2" style="gap:16px;margin-top:18px">
          <div class="field"><label>รายได้ต่อเดือน (บาท)</label><input class="input" type="number" name="monthlyIncome" placeholder="เช่น 80000"></div>
          <div class="field"><label>วัตถุประสงค์การซื้อ</label><select class="select" name="purpose"><option>อยู่เอง</option><option>ลงทุนปล่อยเช่า</option><option>ซื้อให้ลูก/ครอบครัว</option><option>เก็งกำไร</option></select></div>
          <div class="field"><label>ธนาคารที่ต้องการยื่นกู้</label><select class="select" name="bank">${p.banks.map(b=>`<option>${b.name}</option>`).join('')}<option>ยังไม่ตัดสินใจ</option></select></div>
          <div class="field"><label>รู้จักโครงการจากช่องทางใด</label><select class="select" name="source"><option>Google</option><option>Facebook / Instagram</option><option>ป้ายโฆษณา</option><option>เพื่อนแนะนำ</option><option>เอเจนต์</option><option>อื่น ๆ</option></select></div>
        </div>
      </div>

      <div class="card card-flat">
        <label class="check"><input type="checkbox" name="pdpa" required><span><b style="color:#fff">ยินยอมตาม PDPA</b> — ข้าพเจ้ายินยอมให้บริษัทเก็บ รวบรวม ใช้ และเปิดเผยข้อมูลส่วนบุคคล เพื่อการพิจารณาจอง ทำสัญญา ยื่นสินเชื่อ และการโอนกรรมสิทธิ์ <a class="accent" href="#">อ่านนโยบายฉบับเต็ม</a></span></label>
        <label class="check" style="margin-top:14px"><input type="checkbox" name="terms" required><span>ข้าพเจ้าได้อ่านและยอมรับ <a class="accent" href="#">เงื่อนไขการจอง</a> โดยเข้าใจว่าเงินจองจะไม่ได้รับคืนหากยกเลิกโดยผู้ซื้อเอง และต้องทำสัญญาภายใน 7 วัน</span></label>
        <label class="check" style="margin-top:14px"><input type="checkbox" name="marketing"><span>ยินดีรับข่าวสารโปรโมชั่นและโครงการใหม่ (ยกเลิกได้ทุกเมื่อ)</span></label>
      </div>

      <div class="row" style="gap:12px">
        <button type="button" class="btn btn-ghost" onclick="go(1)">← ย้อนกลับ</button>
        <button type="submit" class="btn btn-primary">ถัดไป: ตรวจสอบยอดรวม</button>
      </div>
    </form>`;

  /* ---- 3. review ---- */
  const pane3 = c => `
    <h1 style="font-size:30px">ตรวจสอบรายละเอียดทั้งหมด</h1>
    <p class="lead" style="margin-top:12px">นี่คือทุกบาทที่คุณจะต้องจ่ายตลอดการซื้อห้องนี้ ตั้งแต่วันนี้จนถึงวันรับกุญแจ</p>

    <div class="card" style="margin-top:26px">
      <div class="row-between"><h4 style="margin:0">ห้องที่เลือก</h4><a class="tiny accent" href="unit.html?id=${encodeURIComponent(u.id)}">ดูรายละเอียดห้อง →</a></div>
      <div class="grid g2" style="gap:0 24px;margin-top:16px">
        <div class="kv"><span class="k">โครงการ</span><span class="v">${p.nameTh}</span></div>
        <div class="kv"><span class="k">เลขที่ห้อง</span><span class="v">${u.unitNo} (อาคาร ${u.building})</span></div>
        <div class="kv"><span class="k">แบบห้อง</span><span class="v">${u.roomType} · ${u.layoutCode}</span></div>
        <div class="kv"><span class="k">ชั้น</span><span class="v">${u.floor}</span></div>
        <div class="kv"><span class="k">พื้นที่ใช้สอย</span><span class="v">${u.usableAreaSqm} ตร.ม. (+ระเบียง ${u.balconyAreaSqm})</span></div>
        <div class="kv"><span class="k">ทิศ / วิว</span><span class="v">${u.direction} · ${u.view}</span></div>
        <div class="kv"><span class="k">เฟอร์นิเจอร์</span><span class="v">${u.furnishing}</span></div>
        <div class="kv"><span class="k">ที่จอดรถ</span><span class="v">${u.parkingSlots} คัน</span></div>
        <div class="kv"><span class="k">กำหนดโอน</span><span class="v">${p.quarterCompleted}</span></div>
        <div class="kv"><span class="k">กรรมสิทธิ์</span><span class="v">${p.ownership}</span></div>
      </div>
    </div>

    <div class="card" style="margin-top:20px">
      <h4>ผู้ซื้อ</h4>
      <div class="grid g2" style="gap:0 24px;margin-top:16px">
        <div class="kv"><span class="k">ชื่อ-นามสกุล</span><span class="v">${CUSTOMER.prefix} ${CUSTOMER.firstName} ${CUSTOMER.lastName}</span></div>

      const finder=(x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8);
      const on = finder ? ((x===0||x===6||y===0||y===6||(x>1&&x<5&&y>1&&y<5)) ||
                 (x>n-8&&((x===n-7||x===n-1||y===0||y===6)||(x>n-6&&x<n-2&&y>1&&y<5))) ||
                 (y>n-8&&((x===0||x===6||y===n-7||y===n-1)||(x>1&&x<5&&y>n-6&&y<n-2))))
                 : rnd()>0.52;
      if(on) cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);
    }
    return `<svg class="qr" viewBox="0 0 ${n} ${n}" xmlns="http://www.w3.org/2000/svg"><g fill="#0A0A0A">${cells.join('')}</g></svg>`;
  }

  shell();
  setTimeout(()=>{ if(STEP===4) switchMethod('QR PromptPay'); },0);
  const _go = window.go;
  window.go = s => { _go(s); if(s===4) switchMethod('QR PromptPay'); };
  renderFooter();
}
</script>
