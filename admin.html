<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบผู้ดูแล — NIRA Residence</title>
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/theme.css">
<style>
body{overflow-x:hidden;}
.shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh;}
.aside{background:var(--bg-soft);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px;}
.aside .brand{margin:4px 8px 22px;font-size:18px;}
.aside .grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin:18px 10px 8px;}
.aside button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:14px;display:flex;gap:10px;align-items:center;width:100%;}
.aside button:hover{background:rgba(255,255,255,.05);color:#fff;}
.aside button.on{background:var(--accent);color:#0A0A0A;font-weight:600;}
.aside .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.08);padding:2px 7px;border-radius:99px;}
.aside button.on .cnt{background:rgba(0,0,0,.18);}
.main{padding:26px 30px 70px;min-width:0;}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:26px;}
.pane{display:none;} .pane.on{display:block;}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.kpi .card{padding:20px;}
.kpi .v{font-size:29px;font-weight:700;letter-spacing:-.03em;margin-top:7px;}
.kpi .d{font-size:12px;margin-top:7px;}
.up{color:var(--ok);} .down{color:var(--danger);}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start;}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
@media(max-width:1280px){.kpi{grid-template-columns:repeat(2,1fr);}.two,.three{grid-template-columns:1fr;}}
@media(max-width:900px){.shell{grid-template-columns:1fr;}.aside{position:static;height:auto;flex-direction:row;overflow-x:auto;flex-wrap:nowrap;}.aside .grp,.aside .brand{display:none;}.aside button{white-space:nowrap;width:auto;}.main{padding:20px 18px 60px;}}
/* bars */
.bars{display:flex;align-items:flex-end;gap:10px;height:190px;}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;}
.bar i{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--accent),rgba(214,255,102,.28));display:block;transition:height .8s cubic-bezier(.16,1,.3,1);}
.bar span{font-size:11px;color:var(--muted-2);}
/* funnel */
.fn{display:grid;gap:9px;}
.fn div{padding:11px 16px;border-radius:8px;background:rgba(214,255,102,.1);border:1px solid rgba(214,255,102,.2);display:flex;justify-content:space-between;font-size:13.5px;}
/* donut legend */
.dleg{display:grid;gap:9px;font-size:13px;}
.dleg div{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.dleg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:8px;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:300;transform:translateX(105%);transition:transform .35s cubic-bezier(.16,1,.3,1);overflow:auto;padding:28px;}
.drawer.open{transform:none;box-shadow:-30px 0 70px rgba(0,0,0,.6);}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
.toolbar .input,.toolbar .select{width:auto;min-width:150px;}
</style>
</head>
<body>
<script src="assets/data.js"></script>
<script src="assets/ui.js"></script>

<div class="shell">
  <!-- =============== SIDEBAR =============== -->
  <aside class="aside" id="aside">
    <a class="brand" href="index.html"><span class="brand-mark">N</span><span>NIRA<span class="accent">.</span></span></a>
    <div class="grp">ภาพรวม</div>
    <button class="on" data-p="dash">📊 แดชบอร์ด</button>
    <button data-p="reports">📈 รายงานการขาย</button>
    <div class="grp">การขาย</div>
    <button data-p="leads">🎯 ลูกค้าผู้สนใจ<span class="cnt" id="cLeads"></span></button>
    <button data-p="appts">🗓 นัดชมห้อง<span class="cnt" id="cAppt"></span></button>
    <button data-p="bookings">📄 ใบจอง<span class="cnt" id="cBook"></span></button>
    <button data-p="payments">💳 การชำระเงิน<span class="cnt" id="cPay"></span></button>
    <div class="grp">สินค้า</div>
    <button data-p="projects">🏢 โครงการ</button>
    <button data-p="units">🏠 ยูนิต<span class="cnt" id="cUnit"></span></button>
    <button data-p="promos">🎁 โปรโมชั่น</button>
    <div class="grp">ระบบ</div>
    <button data-p="customers">👥 ลูกค้า</button>
    <button data-p="settings">⚙️ ตั้งค่า &amp; สิทธิ์</button>
    <div style="margin-top:auto;padding:14px 10px 0">
      <a class="tiny muted" href="index.html">← กลับหน้าเว็บลูกค้า</a>
    </div>
  </aside>

  <!-- =============== MAIN =============== -->
  <main class="main">
    <div class="topbar">
      <div>
        <h1 style="font-size:26px" id="pageTitle">แดชบอร์ด</h1>
        <div class="tiny muted" id="pageSub">ภาพรวมการขายทุกโครงการ · อัปเดต 12 ส.ค. 2569</div>
      </div>
      <div class="row" style="gap:10px">
        <button class="btn btn-ghost btn-sm" onclick="Store.reset()">รีเซ็ตข้อมูลสาธิต</button>
        <div class="row" style="gap:10px;padding-left:12px;border-left:1px solid var(--line)">
          <div style="width:34px;height:34px;border-radius:50%;background:var(--accent);color:#0A0A0A;display:grid;place-items:center;font-weight:700;font-size:13px">พ</div>
          <div><div style="font-size:13.5px;font-weight:600">คุณพลอย</div><div class="tiny muted">Sales Manager</div></div>
        </div>
      </div>
    </div>

    <div class="pane on" id="p-dash"></div>
    <div class="pane" id="p-reports"></div>
    <div class="pane" id="p-leads"></div>
    <div class="pane" id="p-appts"></div>
    <div class="pane" id="p-bookings"></div>
    <div class="pane" id="p-payments"></div>
    <div class="pane" id="p-projects"></div>
    <div class="pane" id="p-units"></div>
    <div class="pane" id="p-promos"></div>
    <div class="pane" id="p-customers"></div>
    <div class="pane" id="p-settings"></div>
  </main>
</div>

<div class="drawer" id="drawer"></div>

<script>
const TITLES = {
  dash:['แดชบอร์ด','ภาพรวมการขายทุกโครงการ · อัปเดต 12 ส.ค. 2569'],
  reports:['รายงานการขาย','วิเคราะห์ยอดขาย อัตราดูดซับ และ Sales Funnel'],
  leads:['ลูกค้าผู้สนใจ (Leads)','ติดตามและอัปเดตสถานะผู้สนใจแต่ละราย'],
  appts:['นัดชมห้อง','จัดการคำขอนัดหมายและมอบหมายเจ้าหน้าที่'],
  bookings:['ใบจอง','ตรวจสอบและอัปเดตสถานะใบจองทั้งหมด'],
  payments:['การชำระเงิน','ตรวจสอบสลิปและออกใบเสร็จ'],
  projects:['โครงการ','ข้อมูลหลักของแต่ละโครงการ'],
  units:['ยูนิต','จัดการราคา สถานะ และรายละเอียดห้อง'],
  promos:['โปรโมชั่น','แคมเปญส่วนลดและของแถม'],
  customers:['ลูกค้า','ฐานข้อมูลลูกค้าทั้งหมด'],
  settings:['ตั้งค่า & สิทธิ์','ค่าธรรมเนียม เงื่อนไขการชำระ และผู้ใช้งานระบบ']
};
const RENDER = {};

document.querySelectorAll('#aside button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#aside button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const k=b.dataset.p;
  document.getElementById('p-'+k).classList.add('on');
  document.getElementById('pageTitle').textContent=TITLES[k][0];
  document.getElementById('pageSub').textContent=TITLES[k][1];
  RENDER[k]&&RENDER[k]();
  window.scrollTo({top:0});
});

function counts(){
  document.getElementById('cLeads').textContent=Store.leads().length;
  document.getElementById('cAppt').textContent=Store.appointments().filter(a=>a.status==='Pending').length;
  document.getElementById('cBook').textContent=Store.bookings().length;
  document.getElementById('cPay').textContent=Store.payments().filter(p=>p.status==='Waiting verify').length;
  document.getElementById('cUnit').textContent=Store.units().length;
}
function drawer(html){const d=document.getElementById('drawer');d.innerHTML=`<button class="btn btn-ghost btn-sm" style="margin-bottom:20px" onclick="closeDrawer()">✕ ปิด</button>`+html;d.classList.add('open');}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');}

/* ================= DASHBOARD ================= */
RENDER.dash = () => {
  const units = Store.units();
  const sold = units.filter(u=>['Sold','Contracted'].includes(u.status));
  const reserved = units.filter(u=>u.status==='Reserved');
  const avail = units.filter(u=>u.status==='Available');
  const revenue = sold.reduce((s,u)=>s+u.priceNet,0);
  const pipeline = reserved.reduce((s,u)=>s+u.priceNet,0);
  const absorb = (sold.length+reserved.length)/units.length*100;
  const pays = Store.payments();
  const collected = pays.filter(p=>p.status==='Verified').reduce((s,p)=>s+p.amount,0);
  const pending = pays.filter(p=>p.status==='Waiting verify');

  const months=['มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.'];
  const salesByMonth=[6,9,7,13,11,15];
  const maxS=Math.max(...salesByMonth);

  const statusCount = {};
  units.forEach(u=>statusCount[u.status]=(statusCount[u.status]||0)+1);
  const COLORS={Available:'#D6FF66',Reserved:'#FBBF24',Contracted:'#60A5FA',Sold:'#F87171',Blocked:'#52525B'};

  document.getElementById('p-dash').innerHTML = `
  <div class="kpi">
    <div class="card"><div class="tiny muted">มูลค่าที่ขายได้ (Sold + Contract)</div><div class="v">${fmt.baht(revenue)}</div><div class="d up">▲ 12.4% จากเดือนก่อน</div></div>
    <div class="card"><div class="tiny muted">Pipeline (จองรอสัญญา)</div><div class="v">${fmt.baht(pipeline)}</div><div class="d muted">${reserved.length} ยูนิตที่จองแล้วรอทำสัญญา</div></div>
    <div class="card"><div class="tiny muted">อัตราดูดซับ (Absorption)</div><div class="v">${absorb.toFixed(1)}%</div><div class="d up">▲ 3.1% จากเดือนก่อน</div></div>
    <div class="card"><div class="tiny muted">ห้องว่างคงเหลือ</div><div class="v">${avail.length}</div><div class="d muted">จากทั้งหมด ${units.length} ยูนิต</div></div>
  </div>

  <div class="two" style="margin-top:20px">
    <div class="card">
      <div class="row-between" style="margin-bottom:22px"><h4 style="margin:0">ยอดจองรายเดือน (ยูนิต)</h4><span class="badge">6 เดือนล่าสุด</span></div>
      <div class="bars">${salesByMonth.map((v,i)=>`<div class="bar"><b class="tiny accent">${v}</b><i style="height:${v/maxS*150}px"></i><span>${months[i]}</span></div>`).join('')}</div>
    </div>
    <div class="card">
      <h4 style="margin-bottom:18px">สถานะยูนิตทั้งหมด</h4>
      <div class="row" style="gap:22px;align-items:center">
        ${donut(statusCount,COLORS)}
        <div class="dleg" style="flex:1">
          ${Object.entries(statusCount).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
            const [cls,lab]=STATUS_STYLE[k]||['',k];
            return `<div><span><i style="background:${COLORS[k]||'#555'}"></i>${lab}</span><b>${v}</b></div>`;}).join('')}
        </div>
      </div>
    </div>
  </div>

  <div class="two" style="margin-top:20px">
    <div class="card">
      <h4 style="margin-bottom:16px">รายการชำระเงินที่รอตรวจสอบ</h4>
      ${pending.length?`<div class="tablewrap" style="border:0"><table>
        <thead><tr><th>ใบจอง</th><th>รายการ</th><th class="num">จำนวน</th><th>ช่องทาง</th><th>วันที่</th><th></th></tr></thead>
        <tbody>${pending.map(p=>{const b=Store.booking(p.bookingId);return `<tr>
          <td class="tiny">${b?.bookingNo||p.bookingId}</td><td>${p.type}</td><td class="num">${fmt.baht(p.amount)}</td>
          <td class="tiny">${p.method}</td><td class="tiny">${fmt.date(p.paidAt)}</td>
          <td><button class="btn btn-sm btn-primary" onclick="verifyPay('${p.id}')">อนุมัติ</button></td></tr>`;}).join('')}
        </tbody></table></div>`:'<p class="tiny muted">ไม่มีรายการค้างตรวจสอบ</p>'}
      <div class="kv total" style="margin-top:14px"><span class="k">ยอดเก็บเงินสะสม (ตรวจสอบผ่าน)</span><span class="v">${fmt.baht(collected)}</span></div>
    </div>
    <div class="card">
      <h4 style="margin-bottom:16px">Sales Funnel</h4>
      <div class="fn">
        ${(()=>{const L=Store.leads();const stages=[['ผู้สนใจทั้งหมด',L.length],['ติดต่อแล้ว',L.filter(l=>l.status!=='New').length],['นัดชมห้อง',L.filter(l=>['Appointment','Negotiating','Booked'].includes(l.status)).length],['เจรจา',L.filter(l=>['Negotiating','Booked'].includes(l.status)).length],['ปิดการขาย',L.filter(l=>l.status==='Booked').length]];
        return stages.map(([k,v],i)=>`<div style="width:${100-i*11}%"><span>${k}</span><b>${v}</b></div>`).join('');})()}
      </div>
      <hr class="divider" style="margin:20px 0">
      <h4 style="margin-bottom:14px">นัดหมายวันนี้–สัปดาห์นี้</h4>
      ${Store.appointments().slice(0,4).map(a=>{const p=Store.project(a.projectId);
        return `<div class="kv"><span class="k">${fmt.date(a.date)} ${a.slot}<br><span class="tiny">${p.nameTh}</span></span><span class="v">${badge(a.status)}</span></div>`;}).join('')}
    </div>
  </div>

  <div class="card" style="margin-top:20px">
    <h4 style="margin-bottom:16px">ผลการขายแยกตามโครงการ</h4>
    <div class="tablewrap" style="border:0"><table>
      <thead><tr><th>โครงการ</th><th>สถานะ</th><th class="num">ยูนิตทั้งหมด</th><th class="num">ว่าง</th><th class="num">จอง</th><th class="num">ขายแล้ว</th><th class="num">ดูดซับ</th><th class="num">มูลค่าขายได้</th></tr></thead>
      <tbody>${Store.projects().map(p=>{
        const us=Store.units({projectId:p.id});
        const a=us.filter(u=>u.status==='Available').length;
        const r=us.filter(u=>u.status==='Reserved').length;
        const s=us.filter(u=>['Sold','Contracted'].includes(u.status));
        const ab=((us.length-a)/us.length*100).toFixed(1);
        return `<tr><td><b>${p.nameTh}</b><div class="tiny muted">${p.district}</div></td><td>${badge(p.status)}</td>
          <td class="num">${us.length}</td><td class="num accent">${a}</td><td class="num">${r}</td><td class="num">${s.length}</td>
          <td class="num">${ab}%</td><td class="num"><b>${fmt.baht(s.reduce((x,u)=>x+u.priceNet,0))}</b></td></tr>`;}).join('')}
      </tbody></table></div>
  </div>`;
};

function donut(counts,COLORS){
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  let acc=0; const R=54,C=2*Math.PI*R;
  const segs=Object.entries(counts).map(([k,v])=>{
    const len=v/total*C; const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${COLORS[k]||'#555'}" stroke-width="22"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`;
    acc+=len; return s;}).join('');
  return `<svg width="140" height="140" viewBox="0 0 140 140">${segs}
    <text x="70" y="66" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">${total}</text>
    <text x="70" y="84" text-anchor="middle" fill="#A1A1AA" font-size="10">ยูนิต</text></svg>`;
}
function verifyPay(id){
  const p=Store.payments().find(x=>x.id===id);
  p.status='Verified'; p.receiptNo='RC-'+Date.now().toString().slice(-8);
  Store.save(); toast('อนุมัติการชำระเงินแล้ว'); RENDER.dash(); counts();
}

/* ================= REPORTS ================= */
RENDER.reports = () => {
  const units=Store.units();
  const byType={}, byFloorBand={}, byPriceBand={};
  units.forEach(u=>{
    const sold=['Sold','Contracted','Reserved'].includes(u.status);
    byType[u.roomType]=byType[u.roomType]||{t:0,s:0,rev:0};
    byType[u.roomType].t++; if(sold){byType[u.roomType].s++;byType[u.roomType].rev+=u.priceNet;}
    const band=u.floor<=10?'ชั้น 1-10':u.floor<=20?'ชั้น 11-20':u.floor<=30?'ชั้น 21-30':'ชั้น 31+';
    byFloorBand[band]=byFloorBand[band]||{t:0,s:0}; byFloorBand[band].t++; if(sold)byFloorBand[band].s++;
    const pb=u.priceNet<4e6?'ต่ำกว่า 4 ล้าน':u.priceNet<7e6?'4–7 ล้าน':u.priceNet<12e6?'7–12 ล้าน':'มากกว่า 12 ล้าน';
    byPriceBand[pb]=byPriceBand[pb]||{t:0,s:0}; byPriceBand[pb].t++; if(sold)byPriceBand[pb].s++;
  });
  const tbl=(title,obj,extra)=>`<div class="card">
    <h4 style="margin-bottom:16px">${title}</h4>
    <div class="tablewrap" style="border:0"><table style="min-width:0">
      <thead><tr><th>หมวด</th><th class="num">ทั้งหมด</th><th class="num">ขาย/จองแล้ว</th><th class="num">%</th>${extra?'<th class="num">มูลค่า</th>':''}</tr></thead>
      <tbody>${Object.entries(obj).map(([k,v])=>`<tr><td>${k}</td><td class="num">${v.t}</td><td class="num">${v.s}</td>
        <td class="num"><b class="${v.s/v.t>.5?'accent':''}">${(v.s/v.t*100).toFixed(0)}%</b></td>
        ${extra?`<td class="num">${fmt.baht(v.rev||0)}</td>`:''}</tr>`).join('')}</tbody></table></div></div>`;

  document.getElementById('p-reports').innerHTML=`
    <div class="three">
      ${tbl('ยอดขายแยกตามแบบห้อง',byType,true)}
      ${tbl('ยอดขายแยกตามช่วงชั้น',byFloorBand)}
      ${tbl('ยอดขายแยกตามช่วงราคา',byPriceBand)}
    </div>
    <div class="two" style="margin-top:20px">
      <div class="card">
        <h4 style="margin-bottom:18px">แหล่งที่มาของลูกค้า (Lead Source)</h4>
        ${(()=>{const src={};Store.db.customers.forEach(c=>src[c.source]=(src[c.source]||0)+1);
          const mx=Math.max(...Object.values(src));
          return Object.entries(src).map(([k,v])=>`<div style="margin-bottom:14px">
            <div class="row-between tiny" style="margin-bottom:6px"><span>${k}</span><span class="accent">${v} ราย</span></div>
            <div style="height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden"><i style="display:block;height:100%;width:${v/mx*100}%;background:var(--accent)"></i></div>
          </div>`).join('');})()}
      </div>
      <div class="card">
        <h4 style="margin-bottom:18px">ผลงานทีมขาย</h4>
        <div class="tablewrap" style="border:0"><table style="min-width:0">
          <thead><tr><th>เจ้าหน้าที่</th><th class="num">ยูนิตดูแล</th><th class="num">ปิดได้</th><th class="num">มูลค่า</th></tr></thead>
          <tbody>${(()=>{const t={};units.forEach(u=>{t[u.salesOwner]=t[u.salesOwner]||{n:0,s:0,rev:0};t[u.salesOwner].n++;
            if(['Sold','Contracted','Reserved'].includes(u.status)){t[u.salesOwner].s++;t[u.salesOwner].rev+=u.priceNet;}});

function editUnit(id){
  const u=Store.unit(id),p=Store.project(u.projectId);

    <div class="tiny muted" style="margin-top:6px">${p.nameTh} · ${u.roomType} · ${u.layoutCode}</div>
    <div class="card" style="margin-top:18px">
      <div class="kv"><span class="k">ชั้น / อาคาร</span><span class="v">${u.floor} / ${u.building}</span></div>
      <div class="kv"><span class="k">พื้นที่ใช้สอย</span><span class="v">${u.usableAreaSqm} ตร.ม.</span></div>
      <div class="kv"><span class="k">ระเบียง</span><span class="v">${u.balconyAreaSqm} ตร.ม.</span></div>
      <div class="kv"><span class="k">ทิศ / วิว</span><span class="v">${u.direction} · ${u.view}</span></div>
      <div class="kv"><span class="k">ค่าส่วนกลาง/เดือน</span><span class="v">${fmt.baht(u.commonFeeMonthly)}</span></div>
      <div class="kv"><span class="k">เงินกองทุนแรกเข้า</span><span class="v">${fmt.baht(u.sinkingFund)}</span></div>
    </div>
    <div style="display:grid;gap:14px;margin-top:18px">
      <div class="field"><label>ราคาป้าย (บาท)</label><input class="input" type="number" id="euList" value="${u.priceList}"></div>
      <div class="field"><label>ส่วนลด (บาท)</label><input class="input" type="number" id="euDisc" value="${u.discount}"></div>
      <div class="field"><label>สถานะการขาย</label><select class="select" id="euStatus">${UNIT_STATUS.map(s=>`<option value="${s}" ${s===u.status?'selected':''}>${STATUS_STYLE[s]?.[1]||s}</option>`).join('')}</select></div>
      <div class="field"><label>เฟอร์นิเจอร์</label><select class="select" id="euFurn">${FURNISH.map(s=>`<option ${s===u.furnishing?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label>ที่ปรึกษาการขายที่ดูแล</label><select class="select" id="euOwner">${['คุณพลอย','คุณเจมส์','คุณนัท','คุณฟ้า'].map(s=>`<option ${s===u.salesOwner?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label>แท็ก (คั่นด้วยจุลภาค)</label><input class="input" id="euTags" value="${u.tags.join(', ')}"></div>

      <a class="btn btn-ghost" href="unit.html?id=${encodeURIComponent(u.id)}" target="_blank">ดูหน้าเว็บลูกค้า ↗</a>
    </div>`);
}
function saveUnit(id){
  const u=Store.unit(id);
  u.priceList=+document.getElementById('euList').value;
  u.discount=+document.getElementById('euDisc').value;
  u.priceNet=u.priceList-u.discount;
  u.pricePerSqm=Math.round(u.priceNet/u.usableAreaSqm);
  u.status=document.getElementById('euStatus').value;
  u.furnishing=document.getElementById('euFurn').value;
  u.salesOwner=document.getElementById('euOwner').value;
  u.tags=document.getElementById('euTags').value.split(',').map(s=>s.trim()).filter(Boolean);
  Store.save(); closeDrawer(); toast('บันทึกข้อมูลยูนิตแล้ว'); RENDER.units();
}

function exportJson(){
  const blob=new Blob([JSON.stringify(Store.db,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='nira-data.json'; a.click();
  toast('ส่งออกไฟล์ JSON แล้ว');
}

/* ---------- table helpers ---------- */
function filterTable(input, tblId){
  const q=input.value.toLowerCase();
  document.querySelectorAll('#'+tblId+' tbody tr').forEach(tr=>{
    tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}
function filterCol(sel, tblId, col){
  const q=sel.value.toLowerCase();
  document.querySelectorAll('#'+tblId+' tbody tr').forEach(tr=>{
    tr.style.display = !q || (tr.children[col]?.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
}
